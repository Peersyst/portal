apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    alb.ingress.kubernetes.io/certificate-arn: {{ .Values.ingress.certificate }}
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS":443}]'
    alb.ingress.kubernetes.io/actions.ssl-redirect: '443'
    alb.ingress.kubernetes.io/load-balancer-name: portal-{{ .Values.deployment.env.environment }}
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path.portal-frontend: /
    alb.ingress.kubernetes.io/actions.portal-frontend: >
      {"type":"forward","forwardConfig":{"targetGroups":[{"serviceName":"portal-frontend","servicePort":"http","weight":20}]}}
    alb.ingress.kubernetes.io/healthcheck-path.portal-api: /api/bridge/chains
    alb.ingress.kubernetes.io/actions.portal-api: >
      {"type":"forward","forwardConfig":{"targetGroups":[{"serviceName":"portal-api","servicePort":"api","weight":20}]}}
    alb.ingress.kubernetes.io/actions.redirect-to-xrplevm: >
      {"Type":"redirect","RedirectConfig":{"Host":"bridge.xrplevm.org","Path":"/#{path}","Port":"443","Protocol":"HTTPS","Query":"#{query}","StatusCode":"HTTP_301"}}
  name: {{ .Values.ingress.name }}-{{ .Values.deployment.env.environment }}
  namespace: portal
spec:
  ingressClassName: alb
  rules:
  - host: bridge.devnet.xrpl.org
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: redirect-to-xrplevm
            port:
              name: use-annotation
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: portal-frontend
            port:
              name: use-annotation
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: portal-api
            port:
              name: use-annotation
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    prometheus.io/port: "8888"
    prometheus.io/scrape: "true"
  name: {{ .Values.service.name }}
  namespace: portal
spec:
  ports:
  - name: http
    port: {{ .Values.service.port }}
    targetPort: {{ .Values.service.targetPort }}
  selector:
    app: {{ .Values.deployment.name }}-{{ .Values.deployment.env.environment }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.deployment.name }}
  namespace: portal
  labels:
    app: {{ .Values.deployment.name }}-{{ .Values.deployment.env.environment }}
spec:
  replicas: {{ .Values.deployment.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.deployment.name }}-{{ .Values.deployment.env.environment }}
  template:
    metadata:
      annotations:
        timestamp: {{ .Values.timestamp }}
      labels:
        app: {{ .Values.deployment.name }}-{{ .Values.deployment.env.environment }}
    spec:
      containers:
      - name: {{ .Values.deployment.name }}
        image: peersyst/evm-sidechain-bridge-portal-frontend:{{ .Values.tag }}
        imagePullPolicy: Always
        args: {{ .Values.deployment.args }}
        resources:
          requests:
            memory: {{ .Values.deployment.memoryRequest }}
            cpu: {{ .Values.deployment.cpuRequest }}
          limits:
            memory: {{ .Values.deployment.memoryLimit }}
            cpu: {{ .Values.deployment.cpuLimit }}
        ports:
        - containerPort: {{ .Values.deployment.port }}
