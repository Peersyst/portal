name: build-mobile

on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Checkout repository under $GITHUB_WORKSPACE path
      - name: Repository checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ github.job }}-${{ runner.os }}-buildx-mobile
          restore-keys: |
            ${{ github.job }}-${{ runner.os }}-buildx-mobile

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PUSH_TOKEN }}

      # Build docker image
      - name: Build docker image
        uses: docker/build-push-action@v4
        with:
            file: docker/mobile.Dockerfile
            target: ${{ inputs.target }}
            push: false
            tags: ${{ env.DOCKER_IMAGE_NAME }}
            cache-from: type=local,src=/tmp/.buildx-cache
            cache-to: type=local,dest=/tmp/.buildx-cache-new
            build-args: |
              BASE_IMAGE=${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}-base:${{ github.sha }}
              EXPO_TOKEN=${{ secrets.EXPO_TOKEN }}
              PROFILES=staging
              BUILD_NUMBER=${{ github.run_number }}
      - name: Move cache
        if: always()
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache
