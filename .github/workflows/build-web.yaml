name: build-web

on:
    workflow_call:
        inputs:
            push:
                required: true
                type: boolean
            target:
                required: true
                type: string

env:
    REGISTRY: ghcr.io

jobs:
    build:
        name: Build
        runs-on: ubuntu-latest
        environment: ${{ matrix.environment }}
        strategy:
            matrix:
                environment: [ 'staging' ]
            fail-fast: false
        timeout-minutes: 30
        steps:
            # Checkout repository under $GITHUB_WORKSPACE path
            -   name: Repository checkout
                uses: actions/checkout@v4

            -   name: Set up QEMU
                uses: docker/setup-qemu-action@v3

            -   name: Set up Docker Buildx
                uses: docker/setup-buildx-action@v3

            -   uses: actions/cache@v3
                with:
                    path: /tmp/.buildx-cache
                    key: ${{ github.job }}-${{ runner.os }}-buildx-web
                    restore-keys: |
                        ${{ github.job }}-${{ runner.os }}-buildx-web

            -   name: Login to DockerHub
                uses: docker/login-action@v3
                with:
                    registry: ${{ env.REGISTRY }}
                    username: ${{ github.repository_owner }}
                    password: ${{ secrets.GITHUB_TOKEN }}

            # Configure tag name
            -   name: Sets env vars
                run: |
                    DOCKER_IMAGE_NAME_TMP=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ github.event.repository.name }}-web:${{ matrix.environment }}-${GITHUB_SHA:0:8}
                    echo "DOCKER_IMAGE_NAME=${DOCKER_IMAGE_NAME_TMP,,}" >> $GITHUB_ENV

            # Build docker image
            -   name: Build docker image
                uses: docker/build-push-action@v4
                with:
                    file: docker/web.Dockerfile
                    target: ${{ inputs.target }}
                    push: ${{ inputs.push }}
                    tags: ${{ env.DOCKER_IMAGE_NAME }}
                    cache-from: type=local,src=/tmp/.buildx-cache
                    cache-to: type=local,dest=/tmp/.buildx-cache-new
                    build-args: |
                        BASE_IMAGE=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ github.event.repository.name }}-base:${{ github.sha }}
                        APP_CONFIG_PROFILE_IDENTIFIER=${{ vars.WEB_APP_CONFIG_PROFILE_IDENTIFIER }}
                        APP_CONFIG_ENVIRONMENT_IDENTIFIER=${{ vars.WEB_APP_CONFIG_ENVIRONMENT_IDENTIFIER }}
            -   name: Move cache
                if: always()
                run: |
                    rm -rf /tmp/.buildx-cache
                    mv /tmp/.buildx-cache-new /tmp/.buildx-cache
