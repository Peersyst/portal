name: build-base

on:
    workflow_call:

env:
    REGISTRY: ghcr.io

jobs:
    build:
        name: Build
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            # Checkout repository under $GITHUB_WORKSPACE path
            -   name: Repository checkout
                uses: actions/checkout@v4

            -   name: Set up QEMU
                uses: docker/setup-qemu-action@v3

            -   name: Set up Docker Buildx
                uses: docker/setup-buildx-action@v3

            -   name: Login to DockerHub
                uses: docker/login-action@v3
                with:
                    registry: ${{ env.REGISTRY }}
                    username: ${{ github.repository_owner }}
                    password: ${{ secrets.GITHUB_TOKEN }}

            # Configure tag name
            -   name: Sets env vars
                run: |
                    DOCKER_IMAGE_NAME_TMP=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ github.event.repository.name }}-base:${{ github.sha }}
                    echo "DOCKER_IMAGE_NAME=${DOCKER_IMAGE_NAME_TMP,,}" >> $GITHUB_ENV

            # Build docker image
            -   name: Build docker image
                uses: docker/build-push-action@v4
                with:
                    file: docker/base.Dockerfile
                    push: true
                    tags: ${{ env.DOCKER_IMAGE_NAME }}
                    cache-from: type=local,src=/tmp/.buildx-cache
                    cache-to: type=local,dest=/tmp/.buildx-cache-new
            -   name: Move cache
                if: always()
                run: |
                    rm -rf /tmp/.buildx-cache
                    mv /tmp/.buildx-cache-new /tmp/.buildx-cache
