name: "Build and Deploy Preview Environment"

on:
    pull_request:
        types: [opened, synchronize, closed]

jobs:
    preview-environment:
        name: "Build and Deploy Preview Environment"
        runs-on: ubuntu-latest
        env:
            WORKSPACE: ${{ github.event.repository.name }}_${{ github.event.pull_request.number }}
        defaults:
            run:
                working-directory: .terraform/staging
        steps:
            - name: Checkout
              uses: actions/checkout@v2
            # Only set up preview environment for pull requests
            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v1
              with:
                  cli_config_credentials_token: ${{ secrets.TFC_API_TOKEN }}
            # Create terraform workspace
            - name: Create terraform workspace
              if: github.event_name == 'pull_request' && github.event.action != 'closed'
              id: terraform-workspace-create
              run: terraform workspace new ${WORKSPACE} || echo "Workspace ${WORKSPACE} already exists or cannot be created"
            - name: Set workspace env
              run: echo "TF_WORKSPACE=$(echo $WORKSPACE)" >> $GITHUB_ENV
            # Initialize terraform
            - name: Initialize terraform
              if: github.event_name == 'pull_request' && github.event.action != 'closed'
              id: init-terraform
              run: terraform init
            # Builds and deploys backend + Vercel preview environments
            - name: Build and deploy preview environment
              if: github.event_name == 'pull_request' && github.event.action != 'closed'
              id: build-deploy-preview-environment
              run: |
                  terraform apply --auto-approve -var="branch=${{ github.event.pull_request.number }}" -var="project-name=${{ github.event.repository.name }}" -var="aws-secret-access-key=${{ secrets.AWS_SECRET_MANAGER_KEY }}" -var="aws-access-key-id=${{ secrets.AWS_SECRET_MANAGER_KEY_ID }}" -var="docker-token=${{ secrets.DOCKER_READONLY_TOKEN }}" -var="cloudflare-token=${{ secrets.CLOUDFLARE_PEERSYST_TECH_TOKEN }}"
            # Runs Terraform output to display the backend URL and Vercel preview URL
            - name: Terraform Output
              id: output
              if: github.event_name == 'pull_request' && github.event.action != 'closed'
              run: |
                  terraform output -no-color
              continue-on-error: true
            # Creates comments on pull request with Terraform output
            - name: Create comment with Terraform output
              uses: actions/github-script@0.9.0
              if: github.event_name == 'pull_request' && github.event.action != 'closed'
              env:
                  OUTPUT: "${{ steps.output.outputs.stdout }}"
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  script: |
                      const output = `#### Preview Environment Outputs 🖌
                      \`\`\`
                      ${process.env.OUTPUT}
                      \`\`\`
                      `
                      github.issues.createComment({
                        issue_number: context.issue.number,
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        body: output
                      })
            # When user closes or merges pull request, this will destroy the resources then delete the TFC workspace
            - name: Destroy preview environment
              if: github.event.action == 'closed'
              id: destroy-preview-environment
              run: |
                  terraform destroy --auto-approve
                  curl --header "Authorization: Bearer ${{ secrets.TFC_API_TOKEN }}" --header "Content-Type: application/vnd.api+json" --request DELETE "https://app.terraform.io/api/v2/organizations/Peersyst/workspaces/${TF_WORKSPACE}"
