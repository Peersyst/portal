name: "Pull Request"

on:
    pull_request:
        types: [opened, synchronize]

concurrency:
    # Cancel old runs if there is a new commit in the same branch
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build-base:
        uses: ./.github/workflows/build-base.yaml
        secrets: inherit
    build-web:
        needs: [build-base]
        uses: ./.github/workflows/build-web.yaml
        secrets: inherit
        with:
            target: integration
            push: false
    build-api:
        needs: [build-base]
        uses: ./.github/workflows/build-api.yaml
        secrets: inherit
        with:
            target: integration
            push: false
    build-mobile:
        needs: [build-base]
        uses: ./.github/workflows/build-mobile.yaml
        secrets: inherit
        with:
            target: integration
