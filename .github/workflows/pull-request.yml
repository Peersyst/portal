name: "Pull Request"

on:
    pull_request:
        types: [opened, synchronize]

concurrency:
    # Cancel old runs if there is a new commit in the same branch
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build-web:
        uses: ./.github/workflows/build-web.yaml
        secrets: inherit
        with:
            target: integration
            push: false
