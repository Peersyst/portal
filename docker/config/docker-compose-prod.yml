version: '3.5'
services:
    db:
        image: postgres:14.2
        container_name: $PROJECT_NAME-prod-db
        tty: true
        restart: always
        ports:
            - '${DB_PORT}:5432'
        environment:
            POSTGRES_DB: $DB_DATABASE
            POSTGRES_USER: $DB_USER
            POSTGRES_PASSWORD: $DB_PASSWORD
        volumes:
            - ./docker/data/prod/postgres:/var/lib/postgresql/data

    backend:
        image: peersyst/global:${PROJECT_NAME}-${ENVIRONMENT}-backend-latest
        container_name: $PROJECT_NAME-prod-backend
        restart: always
        volumes:
            - ../../logs/backend:/app/logs/

    http:
        image: peersyst/global:${PROJECT_NAME}-${ENVIRONMENT}-http-latest
        container_name: $PROJECT_NAME-prod-http
        restart: always
        ports:
            - '80:80'
        environment:
            BACKEND_UPSTREAM: "server backend:$BACKEND_PORT;"
        volumes:
            - ../../logs/http:/var/log/nginx/

    backups:
        image: peersyst/global:docker-backups-latest
        restart: always
        environment:
            PSQL_HOST: db
            PSQL_PORT: $DB_PORT
            PSQL_USER: $DB_USER
            PSQL_PASSWORD: $DB_PASSWORD
            PSQL_DATABASE: $DB_DATABASE
            INTERVAL_IN_HOURS: 24
            AWS_CLIENT_ID: $AWS_CLIENT_ID
            AWS_CLIENT_SECRET: $AWS_CLIENT_SECRET
            AWS_S3: $AWS_S3
            SLACK_WEBHOOK: $SLACK_WEBHOOK

    watchtower:
        image: containrrr/watchtower
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
